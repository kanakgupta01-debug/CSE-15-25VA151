        let msg=function(){//variable ko function assign krre hain
                console.log("Hello ABES");
        }
        msg();
        //short code for above function i.e, arrow function
        
        let msg1=()=>console.log("Hello World");
        msg1();
        //arrow function with multiple lines
        let msg2=(age)=>{
            if (age>=18){
                console.log("valid age");
            }
        }
        msg2(23);

        //call back function
        //
        function cal(a,b,callback){
            var num1=a;
            console.log("First number is " + num1);
            var num2=b;
            console.log("Second number is " + num2);
            var res=num1+num2;
            callback(res);
        }
        function display(res){//display is call back function
            console.log("Result is " + res);
        }
        cal(4,5,display);

        //callback using setTimeout API

        function greeting()
        {
            document.writeln("Hello Student");
        }
        function loading(){
            document.writeln("Data loading.......");
        }
        loading();
        setTimeout(greeting, 2000);

        //callbackhell->Callback hell, or the "pyramid of doom," is a JavaScript programming issue caused by excessively nesting multiple asynchronous callbacks, making code unreadable, hard to maintain, and difficult to debug

        //JS Promises->JavaScript Promises are objects that represent the eventual completion (or failure) of an asynchronous operation and its resulting value.

        //we use promises iske 3 stages hote hain pending, reject, fullfilled

        //pending->operation started(not finished)
        //rejected->operation failed
        //fullfilled-> operation completed

        let promise=new Promise(function(resolve, reject){//variable name kuch bhi ho skta hai function(){}
            let age1=23;
            if(age1>=18){
                resolve("valid age");
            }
            else{
                reject("wait for next year");
            }
        });
        promise.then(result=>console.log(result)).catch(error=>console.log(error));

        //async and await->Async/await is a modern JavaScript syntax that simplifies working with promises, allowing asynchronous code to be written in a synchronous, easy-to-read manner.

        //fetch api

        async function userData(){
            let userResponse=await fetch('https://jsonplaceholder.typicode.com/todos/1');//api me data key value pair me hota hai
            let userDataRes=await userResponse.json();
            console.log(userDataRes);

        }
        userData();
        //async await using dry catch

        async function productDetail(){
            try{
            let proRes=await fetch('https://jsonplaceholder.typicode.com/todos/1');
            let proResData=await proRes.json();
            console.log(proResData);
        }
        catch(error){
            console.log("not valid data " + error);
        }
    }
    productDetail();
    //IIFE:-
    //()()(IIFE) in JavaScript is a function that runs as soon as it is defined, without needing to be explicitly called later
    (function(){
    console.log("Hello IIFE");
    })();

    //short code for above function
    (msg=>console.log("IIFE"))();

    //local storage:-JavaScript localStorage is a feature that enables web applications to store persistent key-value data in the user's browser.
    let myInfo={
            name:"kanak",
            age:19,
            mobile:873854883,
            address:"GZB"
            };
            //convert object into JSON string
            let myInfoData=JSON.stringify(myInfo);

            //set the data
            localStorage.setItem('preferences',myInfoData);
            //retreive the data and convert into JSON object

            //get data(retreive the data)
            let myPreference=localStorage.getItem('preferences');

            //convert into jSON object
            let myInfoPre=JSON.parse(myPreference);

            //access keys
            console.log(myInfoPre.name);

            //high order function:->Takes one or more functions as arguments (callback functions).
            //Returns a function as its result. 
            //map()create a new array by applying  FUNCTION TO EVERY ELEMENT in the original array

            let num=[3,5,4,2,5,6,7,8];
            let result=num.map(n=>n*2);
            console.log(result);
            //reduce..executes a user-supplied "reducer" callback function on each element of an array, resulting in a single output value.

            let sum=num.reduce((total,n)=>total+n);
            console.log(sum);//40

            //filter..The JavaScript filter() method is a built-in function used on arrays to create a new array containing only the elements that pass a specific condition
            let sorting=num.filter(n=>n>3);
            console.log(sorting);

            //forEach=>The forEach() method in JavaScript is an array method that executes a provided callback function once for each element in an array. 
            num.forEach((n)=>console.log(n*n));
            //` `
